<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>ARCOS LAB</title>
    <link rel="icon" href="vapor.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- DESIGN SYSTEM VAPORWAVE --- */
        :root {
            --bg-dark: #0a0a2a; --bg-light: #2a0a4a;
            --neon-pink: #ff00ff; --neon-cyan: #00ffff; --text: #ffffff;
            --insta-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; background-color: var(--bg-dark); color: var(--text); 
            font-family: 'Montserrat', sans-serif; display: flex; flex-direction: column;
            align-items: center; min-height: 100vh; overflow-x: hidden;
        }

        /* --- FUNDO ANIMADO --- */
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, var(--bg-dark), var(--bg-light)); z-index: -2; }
        body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 200%; background-image: linear-gradient(rgba(255, 0, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px); background-size: 50px 50px; animation: moveGrid 10s linear infinite; z-index: -1; pointer-events: none; }
        @keyframes moveGrid { from { transform: translateY(0); } to { transform: translateY(-50%); } }

        /* --- HEADER --- */
        header { width: 100%; padding: 60px 20px 30px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .logo-img { width: 150px; height: auto; margin-bottom: 20px; border-radius: 50%; box-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-cyan); transition: transform 0.3s; }
        .logo-img:hover { transform: scale(1.05) rotate(5deg); }
        h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 900; margin: 0; line-height: 1; text-transform: uppercase; color: var(--neon-cyan); text-shadow: 2px 2px 0px var(--neon-pink); }
        h2 { font-size: clamp(0.9rem, 3vw, 1.1rem); font-weight: 700; letter-spacing: 3px; margin-top: 10px; color: var(--neon-pink); text-transform: uppercase; }

        /* --- VÍDEO (CORREÇÃO INFALÍVEL) --- */
        .portfolio { width: 100%; max-width: 1200px; padding: 20px 20px 60px; display: flex; flex-direction: column; align-items: center; }
        
        /* O contêiner que segura o espaço */
        .video-wrapper {
            width: 100%; max-width: 340px; /* Largura de celular */
            position: relative; /* Necessário para o truque */
            padding-bottom: 177.77%; /* Força a altura (16/9 * 100) */
            height: 0;
            border-radius: 15px; overflow: hidden; background: #000;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-pink);
            margin-bottom: 20px;
        }
        /* O iframe se estica para preencher o contêiner */
        .video-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        /* --- BOTÃO CENTRAL --- */
        .btn-main { padding: 12px 30px; border-radius: 50px; background: var(--insta-grad); color: white; text-decoration: none; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; border: 2px solid rgba(255,255,255,0.3); box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .btn-main:hover { transform: scale(1.05); border-color: white; }
        .btn-icon { width: 20px; height: 20px; fill: white; margin-right: 10px; }

        /* --- BOTÕES FLUTUANTES --- */
        .floating-container { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 15px; z-index: 999; }
        .float-btn { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.8); box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.3s; cursor: pointer; }
        .float-btn:hover { transform: scale(1.1); }
        .float-icon { width: 28px; height: 28px; fill: white; }
        .btn-x { background: #000; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .btn-insta { background: var(--insta-grad); box-shadow: 0 0 15px rgba(255,0,255,0.4); }
        .btn-whats { background: #25D366; box-shadow: 0 0 15px rgba(37,211,102,0.4); border-color: white; }

        /* --- FOOTER --- */
        footer { margin-top: auto; padding: 40px; text-align: center; font-size: 0.8rem; color: rgba(255,255,255,0.6); letter-spacing: 1px; border-top: 1px solid rgba(255,0,255,0.3); width: 100%; background: rgba(0,0,0,0.3); }
        footer a { color: var(--neon-cyan); font-weight: 700; text-decoration: none; }
    </style>
</head>
