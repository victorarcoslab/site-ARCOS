<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCOS LAB | Architectural Visualization</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Mantivemos a fonte Montserrat por ser limpa e profissional -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- GENERAL SETTINGS --- */
        :root {
            --bg-color: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- MAIN CONTENT --- */
        .content-wrapper {
            width: 100%; 
            max-width: 1200px;
            padding: 0 20px;
            display: flex; 
            flex-direction: column; 
            flex-grow: 1;
        }

        /* --- HEADER --- */
        header { 
            width: 100%; 
            padding: 80px 0 60px; 
            text-align: center;
        }
        
        h1 { 
            font-size: clamp(2rem, 5vw, 3rem); 
            font-weight: 600; 
            margin: 0; 
            letter-spacing: 2px;
        }
        
        h2 { 
            font-size: clamp(0.9rem, 2vw, 1rem); 
            font-weight: 300; 
            letter-spacing: 4px; 
            margin-top: 15px; 
            color: var(--text-muted); 
            text-transform: uppercase; 
        }

        /* --- PORTFOLIO GRID --- */
        .portfolio-grid {
            display: grid;
            /* Cria colunas que se ajustam automaticamente baseadas no tamanho da tela */
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            width: 100%;
            margin-bottom: 80px;
        }

        .image-box {
            width: 100%;
            overflow: hidden;
            background: #f4f4f4; /* Cor de fundo caso a imagem demore a carregar */
            aspect-ratio: 4 / 3; /* Proporção padrão elegante para renders */
        }

        .image-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
            transition: transform 0.5s ease;
        }
        
        /* Efeito sutil de zoom ao passar o mouse */
        .image-box:hover img { 
            transform: scale(1.03); 
        }

        /* --- FOOTER --- */
        footer { 
            padding: 40px 0; 
            text-align: center; 
            font-size: 0.9rem; 
            margin-top: auto;
            width: 100%; 
        }
        
        footer a { 
            color: var(--text-main); 
            font-weight: 400; 
            text-decoration: none; 
            transition: color 0.3s;
        }
        
        footer a:hover {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        
        <header>
            <h1>ARCOS LAB</h1>
            <h2>Architectural Visualization</h2>
        </header>

        <div class="portfolio-grid">
            
            <!-- Adicione suas imagens aqui. Substitua os nomes nos arquivos src="" -->
            <div class="image-box">
                <img src="render-01.jpg" alt="Interior Living Room Archviz">
            </div>

            <div class="image-box">
                <img src="render-02.jpg" alt="Exterior Architecture Visualization">
            </div>
            
            <div class="image-box">
                <img src="render-03.jpg" alt="Modern Kitchen Render">
            </div>

            <div class="image-box">
                <img src="render-04.jpg" alt="Commercial Building Archviz">
            </div>

        </div>

        <footer>
            <p><a href="mailto:victor@arcoslab.com">victor@arcoslab.com</a></p>
        </footer>

    </div>

</body>
</html>
