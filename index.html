<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCOS LAB | Visual Art</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- GENERAL STYLES --- */
        :root {
            --primary: #ffffff;
            --accent: #eb4034; /* Arcos Red */
            --bg: #050505;
            --whatsapp: #25D366;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; background-color: var(--bg); color: #f0f0f0; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
        }
        
        a { text-decoration: none; color: white; transition: 0.3s; }
        
        /* --- MENU --- */
        nav { 
            display: flex; justify-content: center; 
            padding: 30px 5%; 
            position: fixed; width: 100%; top: 0; 
            background: transparent; 
            backdrop-filter: blur(5px);
            z-index: 1000;
        }
        
        .logo { 
            font-size: 1rem; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; 
            cursor: pointer; opacity: 0.8;
        }
        .logo:hover { opacity: 1; letter-spacing: 5px; }

        /* --- HERO SECTION --- */
        .hero { 
            height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
            padding: 20px; 
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }
        
        .reveal { opacity: 0; transform: translateY(30px); transition: all 1s ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        h1 { 
            font-size: clamp(3rem, 9vw, 9rem); 
            margin: 0; text-transform: uppercase; letter-spacing: -2px; line-height: 0.9; font-weight: 900;
            background: -webkit-linear-gradient(#fff, #666); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        /* --- PORTFOLIO (VERTICAL) --- */
        .portfolio { padding: 50px 5% 100px; max-width: 1400px; margin: 0 auto; }
        .section-label { 
            font-size: 0.7rem; color: #444; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; 
            margin-bottom: 80px; display: block; text-align: center;
        }

        .video-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            justify-items: center; 
        }
        
        .video-item { 
            width: 100%;
            max-width: 400px; 
            transition: 0.5s; 
        }
        .video-item:hover { transform: scale(1.02); }

        .video-container {
            position: relative; 
            width: 100%; 
            padding-bottom: 177.77%; /* 9:16 Vertical */
            background: #111; 
            border-radius: 20px; 
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .video-info { margin-top: 25px; text-align: center; }
        .client-name { font-weight: 700; font-size: 1rem; display: block; color: white; margin-bottom: 5px; letter-spacing: 1px;}
        .project-type { color: #555; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }

        /* --- WHATSAPP FLOAT --- */
        .whatsapp-float {
            position: fixed; width: 50px; height: 50px; bottom: 30px; right: 30px;
            background-color: #222; color: #FFF; border-radius: 50px; border: 1px solid #333;
            text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .whatsapp-float:hover { background-color: var(--whatsapp); border-color: var(--whatsapp); transform: scale(1.1); }
        .whatsapp-icon { width: 25px; height: 25px; fill: white; }

        /* --- FOOTER --- */
        footer { text-align: center; padding: 100px 20px; border-top: 1px solid #111; color: #333; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; margin-top: 50px; }
        footer a { color: #555; }
        footer a:hover { color: #fff; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ARCOS LAB</a>
    </nav>

    <div class="hero">
        <h1 class="reveal">ARCOS LAB</h1>
    </div>

    <div class="portfolio" id="portfolio">
        <span class="section-label reveal">Selected Works</span>
        
        <div class="video-grid">
            
            <div class="video-item reveal">
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/eYI5FP4VTAs?controls=1&rel=0" loading="lazy" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <span class="client-name">Street Interview</span>
                    <span class="project-type">Shorts / Reels</span>
                </div>
            </div>

        </div>
    </div>

    <a href="https://wa.me/5511976347250" class="whatsapp-float" target="_blank">
        <svg class="whatsapp-icon" viewBox="0 0 24 24">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.095 3.2 5.076 4.487 2.982 1.288 2.982.858 3.526.801.544-.058 1.733-.708 1.98-1.392.248-.684.248-1.27.174-1.392z"/>
        </svg>
    </a>

    <footer>
        <p>São Paulo • Worldwide</p>
        <p><a href="mailto:contato@arcoslab.com">contato@arcoslab.com</a></p>
    </footer>

    <script>
        window.addEventListener('scroll', reveal);
        function reveal(){
            var reveals = document.querySelectorAll('.reveal');
            for(var i = 0; i < reveals.length; i++){
                var windowheight = window.innerHeight;
                var revealtop = reveals[i].getBoundingClientRect().top;
                if(revealtop < windowheight - 150){ reveals[i].classList.add('active'); }
            }
        }
        reveal();
    </script>
</body>
</html>
