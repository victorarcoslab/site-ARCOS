<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCOS LAB | Vaporwave Edit</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- VAPORWAVE DESIGN SYSTEM --- */
        :root {
            --bg-dark: #0a0a2a;   /* Roxo Noite */
            --bg-light: #2a0a4a;  /* Roxo Ciberespaço */
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --text: #ffffff;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text); 
            font-family: 'Montserrat', sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- FUNDO COM GRID ANIMADO --- */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Degradê de Fundo */
            background: linear-gradient(to bottom, var(--bg-dark), var(--bg-light));
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 200%; /* Altura dobrada para o loop */
            /* O Grid de Linhas Neon */
            background-image: 
                linear-gradient(rgba(255, 0, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 60px 60px;
            /* A Animação de Movimento (Para cima) */
            animation: moveGrid 8s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes moveGrid {
            from { transform: translateY(0); }
            to { transform: translateY(-50%); } 
        }

        /* --- CABEÇALHO --- */
        header {
            width: 100%;
            padding: 60px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: slideDown 1s ease-out forwards;
        }

        .logo-img {
            width: 160px;       
            height: auto;
            margin-bottom: 20px; 
            border-radius: 50%; 
            box-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-cyan);
            transition: transform 0.3s;
        }
        .logo-img:hover { transform: scale(1.05) rotate(2deg); }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
            color: var(--neon-cyan);
            text-shadow: 3px 3px 0px var(--neon-pink);
            letter-spacing: 2px;
        }

        h2 {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            font-weight: 700;
            letter-spacing: 4px; 
            margin-top: 15px;
            color: var(--neon-pink);
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--neon-pink);
        }

        /* --- ÁREA DO VÍDEO --- */
        .portfolio {
            width: 100%;
            max-width: 1200px;
            padding: 40px 20px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeIn 1s 0.5s forwards;
        }

        .video-wrapper {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-pink);
            transition: transform 0.3s;
        }
        .video-wrapper:hover { transform: scale(1.02); }

        .video-container {
            position: relative;
            padding-bottom: 177.77%; /* Formato Vertical 9:16 */
            height: 0;
        }

        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        /* --- BOTÃO INSTAGRAM --- */
        .insta-btn {
            margin-top: 25px;
            display: flex;
            align-items: center;
            padding: 10px 25px;
            /* Degradê do botão */
            background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
            border-radius: 30px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .insta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px var(--neon-pink);
            border-color: var(--neon-cyan);
        }

        .insta-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            fill: white;
        }

        /* --- WHATSAPP & FOOTER --- */
        .whatsapp-btn {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-cyan));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
            transition: transform 0.3s ease;
            z-index: 100;
            border: 2px solid #fff;
        }
        .whatsapp-btn:hover { transform: scale(1.1) rotate(180deg); }
        .whatsapp-icon { width: 30px; height: 30px; fill: white; }

        footer {
            margin-top: auto; padding: 40px; text-align: center;
            font-size: 0.8rem; color: rgba(255,255,255,0.6); letter-spacing: 1px;
            border-top: 1px solid rgba(255,0,255,0.3);
            width: 100%;
            background: rgba(0,0,0,0.3);
        }
        footer a { color: var(--neon-cyan); font-weight: 700; text-decoration: none; }
        footer a:hover { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink); }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
