<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OI BEATRIZ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- ESTILO GERAL --- */
        :root {
            --primary: #ffffff;
            --accent: #eb4034; /* Vermelho Arcos */
            --bg: #050505;
            --whatsapp: #25D366;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; background-color: var(--bg); color: #f0f0f0; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
        }
        
        a { text-decoration: none; color: white; transition: 0.3s; }
        
        /* --- MENU --- */
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 5%; 
            position: fixed; width: 100%; top: 0; 
            background: rgba(5,5,5,0.9); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid #222;
        }
        
        .logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        
        .languages { display: flex; gap: 20px; }
        .languages a { font-size: 0.8rem; color: #888; font-weight: 600; }
        .languages a:hover { color: var(--primary); }
        .languages a.active { color: var(--primary); border-bottom: 2px solid var(--accent); }

        .menu-icon { display: none; font-size: 1.5rem; cursor: pointer; }

        /* --- HERO (CAPA) --- */
        .hero { 
            height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
            padding: 20px; 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }
        
        /* Classe para animação de subida */
        .reveal { opacity: 0; transform: translateY(30px); transition: all 1s ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        h1 { 
            font-size: clamp(2.5rem, 6vw, 6rem); 
            margin: 0; text-transform: uppercase; letter-spacing: 5px; line-height: 1.1; font-weight: 900;
        }
        
        h2 { font-size: clamp(1rem, 2vw, 1.5rem); font-weight: 300; color: #aaa; margin-top: 20px; letter-spacing: 2px; max-width: 600px; }
        
        .cta-button { 
            margin-top: 40px; padding: 15px 40px; 
            background: var(--primary); color: #000; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem;
            border-radius: 50px; border: none; cursor: pointer;
        }
        .cta-button:hover { background: var(--accent); color: white; transform: scale(1.05); }

        /* --- PORTFÓLIO --- */
        .portfolio { padding: 100px 5%; max-width: 1400px; margin: 0 auto; }
        .section-label { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; letter-spacing: 3px; font-weight: 700; margin-bottom: 40px; display: block; border-bottom: 1px solid #222; padding-bottom: 10px; }

        .video-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); 
            gap: 50px; 
        }
        
        .video-item { transition: 0.5s; }
        .video-item:hover { transform: translateY(-10px); }

        .video-container {
            position: relative; width: 100%; padding-bottom: 56.25%; background: #111; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .video-info { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        .client-name { font-weight: 700; font-size: 1.1rem; display: block; color: white; }
        .project-type { color: #666; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; border: 1px solid #333; padding: 5px 10px; border-radius: 20px; }

        /* --- WHATSAPP FLUTUANTE --- */
        .whatsapp-float {
            position: fixed; width: 60px; height: 60px; bottom: 30px; right: 30px;
            background-color: var(--whatsapp); color: #FFF; border-radius: 50px;
            text-align: center; box-shadow: 2px 2px 10px #000;
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--whatsapp); }
        .whatsapp-icon { width: 35px; height: 35px; fill: white; }

        /* --- RODAPÉ --- */
        footer { text-align: center; padding: 80px 20px; border-top: 1px solid #111; color: #444; font-size: 0.8rem; margin-top: 50px; }
        footer a { color: #666; }

        /* --- RESPONSIVO --- */
        @media (max-width: 768px) {
            .video-grid { grid-template-columns: 1fr; }
            .menu-icon { display: block; }
            .languages { 
                display: none; position: absolute; top: 70px; right: 5%; 
                background: #111; padding: 20px; border-radius: 10px; border: 1px solid #333;
                flex-direction: column; 
            }
            .languages.active-menu { display: flex; }
        }
    </style>
</head>

    <script>
        // Menu Mobile
        function toggleMenu() {
            document.getElementById("menuLista").classList.toggle("active-menu");
        }

        // Animação ao rolar (Scroll)
        window.addEventListener('scroll', reveal);
        function reveal(){
            var reveals = document.querySelectorAll('.reveal');
            for(var i = 0; i < reveals.length; i++){
                var windowheight = window.innerHeight;
                var revealtop = reveals[i].getBoundingClientRect().top;
                var revealpoint = 150;
                if(revealtop < windowheight - revealpoint){
                    reveals[i].classList.add('active');
                }
            }
        }
        // Ativa animação inicial ao carregar
        reveal();
    </script>
