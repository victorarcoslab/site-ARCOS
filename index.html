<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCOS LAB | Edição de Vídeo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">

    <style>
        /* --- ESTILO GERAL --- */
        :root {
            --bg: #050505;
            --text: #f0f0f0;
            --accent: #eb4034;
            --whatsapp: #25D366;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; background-color: var(--bg); color: var(--text); 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        a { text-decoration: none; color: white; transition: 0.3s; }

        /* --- CABEÇALHO / LOGO --- */
        header {
            width: 100%;
            padding: 80px 20px 40px; /* Espaço do topo até o logo */
            text-align: center;
            /* Animação de entrada suave */
            opacity: 0; transform: translateY(-20px); animation: fadeIn 1s forwards;
        }

        h1 { 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; /* Negrito */
            font-style: italic; /* Itálico */
            font-size: clamp(3rem, 10vw, 8rem); /* Responsivo */
            margin: 0; 
            letter-spacing: -2px; 
            line-height: 1;
            /* Gradiente sutil para dar textura premium */
            background: -webkit-linear-gradient(#fff, #888); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }

        /* --- PORTFÓLIO (VÍDEO) --- */
        .portfolio { 
            width: 100%; 
            max-width: 1400px; 
            padding: 0 5% 100px; /* Zero no topo para colar no logo */
            display: flex;
            justify-content: center;
            
            /* Animação de entrada (com leve atraso) */
            opacity: 0; transform: translateY(30px); animation: fadeIn 1s 0.3s forwards;
        }

        .video-item { 
            width: 100%;
            max-width: 450px; /* Largura ideal para vídeo vertical no PC */
            transition: 0.5s; 
        }

        .video-container {
            position: relative; 
            width: 100%; 
            padding-bottom: 177.77%; /* Formato 9:16 (Vertical) */
            background: #111; 
            border-radius: 20px; 
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .video-info { margin-top: 20px; text-align: center; opacity: 0.7; }
        .client-name { font-weight: 700; font-size: 0.9rem; display: block; color: white; margin-bottom: 5px;}
        .project-type { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; }

        /* --- WHATSAPP FLUTUANTE --- */
        .whatsapp-float {
            position: fixed; width: 50px; height: 50px; bottom: 30px; right: 30px;
            background-color: #222; color: #FFF; border-radius: 50px; border: 1px solid #333;
            text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .whatsapp-float:hover { background-color: var(--whatsapp); border-color: var(--whatsapp); transform: scale(1.1); }
        .whatsapp-icon { width: 25px; height: 25px; fill: white; }

        /* --- RODAPÉ --- */
        footer { width: 100%; text-align: center; padding: 50px 20px; border-top: 1px solid #111; color: #333; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; }
        footer a { color: #555; }
        footer a:hover { color: #fff; }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <header>
        <h1>arcoslab</h1>
    </header>

    <div class="portfolio">
        
        <div class="video-item">
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/eYI5FP4VTAs?controls=1&rel=0" loading="lazy" allowfullscreen></iframe>
            </div>
            <div class="video-info">
                <span class="client-name">Entrevista de Rua</span>
                <span class="project-type">Shorts / Reels</span>
            </div>
        </div>

    </div>
