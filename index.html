<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCOS LAB</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- ESTÉTICA GERAL (DOJO MINIMALISTA) --- */
        :root {
            --bg: #fafafa; /* Branco Papel */
            --ink: #111111; /* Preto Tinta */
            --gray: #888888;
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            background-color: var(--bg); 
            color: var(--ink); 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        a { text-decoration: none; transition: 0.3s; }

        /* --- LOGO (IMAGEM) --- */
        header {
            width: 100%;
            padding: 60px 20px 40px;
            text-align: center;
            opacity: 0; 
            animation: inkFlow 1.5s forwards; /* Animação suave de entrada */
        }

        .logo-img {
            max-width: 180px; /* Tamanho da logo */
            width: 100%;
            height: auto;
            /* Mix-blend-mode ajuda a "fundir" o branco do jpg com o fundo do site */
            mix-blend-mode: multiply; 
            filter: contrast(1.1); /* Realça o preto do traço */
        }

        /* --- VÍDEO (OLD SCHOOL STYLE) --- */
        .portfolio { 
            width: 100%; 
            max-width: 1400px; 
            padding: 0 5% 100px;
            display: flex;
            justify-content: center;
            
            opacity: 0; 
            transform: translateY(20px); 
            animation: fadeIn 1s 0.5s forwards;
        }

        .video-item { 
            width: 100%;
            max-width: 400px; /* Largura controlada */
        }

        .video-container {
            position: relative; 
            width: 100%; 
            padding-bottom: 177.77%; /* 9:16 Vertical */
            background: #000; 
            overflow: hidden;
            /* Sombra suave e difusa, como tinta no papel */
            box-shadow: 0 30px 60px rgba(0,0,0,0.15); 
        }

        .video-container iframe { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
        }
        
        .video-info { 
            margin-top: 25px; 
            text-align: center; 
        }
        
        .project-type { 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; /* Espaçamento elegante */
            color: var(--ink);
            font-weight: 600;
            border-top: 1px solid #ddd;
            padding-top: 15px;
            display: inline-block;
        }

        /* --- BOTÃO WHATSAPP (ESTILO ZEN - PRETO) --- */
        .whatsapp-float {
            position: fixed; width: 50px; height: 50px; bottom: 30px; right: 30px;
            background-color: var(--ink); /* Botão Preto */
            color: #FFF; 
            border-radius: 50%; /* Redondo perfeito */
            text-align: center; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            transition: all 0.4s ease;
        }
        
        .whatsapp-float:hover { 
            transform: scale(1.1) rotate(10deg); 
            background-color: #333;
        }
        
        .whatsapp-icon { width: 24px; height: 24px; fill: white; }

        /* --- FOOTER --- */
        footer { 
            width: 100%; text-align: center; padding: 50px 20px; 
            color: var(--gray); font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; 
        }
        footer a { color: var(--ink); font-weight: 600; }
        footer a:hover { opacity: 0.6; }

        /* ANIMAÇÕES */
        @keyframes inkFlow { 
            from { opacity: 0; transform: scale(0.95); } 
            to { opacity: 1; transform: scale(1); } 
        }
        @keyframes fadeIn { 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

    <header>
        <img src="logo arcos.jpg" alt="ARCOS LAB Logo" class="logo-img">
    </header>

    <div class="portfolio">
        <div class="video-item">
            <div class="video-container">
                <iframe 
                    src="https://www.youtube-nocookie.com/embed/eYI5FP4VTAs?controls=1&rel=0" 
                    title="YouTube video player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-info">
                <span class="project-type">Visual Art / Edit</span>
            </div>
        </div>
    </div>

    <a href="https://wa.me/5511976347250" class="whatsapp-float" target="_blank" aria-label="Contato WhatsApp">

    </footer>

</body>
</html>
