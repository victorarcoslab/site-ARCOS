<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCOS LAB</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --bg: #ffffff;      
            --ink: #000000;     
            --gray: #666666;    
        }

        * { box-sizing: border-box; }

        body { 
            margin: 0; 
            background-color: var(--bg); 
            color: var(--ink); 
            font-family: 'Montserrat', sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- CABEÇALHO --- */
        header {
            width: 100%;
            padding: 60px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: slideDown 0.8s ease-out forwards;
        }

        /* LOGO CORRIGIDA */
        .logo-img {
            width: 120px;       
            height: auto;
            margin-bottom: 20px; 
            display: block;
            mix-blend-mode: multiply; 
        }

        /* TÍTULO */
        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;   
            letter-spacing: -1px;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
        }

        /* SUBTÍTULO */
        h2 {
            font-size: clamp(0.8rem, 2vw, 1rem);
            font-weight: 500;
            letter-spacing: 4px; 
            margin-top: 10px;
            color: var(--gray);
            text-transform: uppercase;
        }

        /* --- VÍDEO --- */
        .portfolio {
            width: 100%;
            max-width: 1200px;
            padding: 0 20px 80px;
            display: flex;
            justify-content: center;
            opacity: 0;
            animation: fadeIn 1s 0.5s forwards;
        }

        .video-wrapper {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
        }

        .video-container {
            position: relative;
            padding-bottom: 177.77%; 
            height: 0;
        }

        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        /* --- WHATSAPP --- */
        .whatsapp-btn {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px;
            background: var(--ink); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            z-index: 100;
        }
        .whatsapp-btn:hover { transform: scale(1.1); }
        .whatsapp-icon { width: 24px; height: 24px; fill: white; }

        /* --- FOOTER --- */
        footer {
            margin-top: auto; padding: 40px; text-align: center;
            font-size: 0.75rem; color: var(--gray); letter-spacing: 1px;
        }
        footer a { color: var(--ink); font-weight: 700; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <img src="logo.jpg" alt="Logo Arcos Lab" class="logo-img">
        
        <h1>ARCOS LAB</h1>
        <h2>Edição de Vídeo</h2>
    </header>

    <div class="portfolio">
        <div class="video-wrapper">
            <div class="video-container">
                <iframe 
                    src="https://www.youtube-nocookie.com/embed/eYI5FP4VTAs?controls=1&rel=0" 
                    title="YouTube video player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <a href="https://wa.me/5511976347250" class="whatsapp-btn" target="_blank" aria-label="WhatsApp">

    <footer>
        <p><a href="mailto:contato@arcoslab.com">contato@arcoslab.com</a></p>
    </footer>

</body>
</html>
