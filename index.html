<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCOS LAB</title>
    <link rel="icon" href="vapor.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- CONFIGURAÇÕES GERAIS --- */
        :root {
            --bg-dark: #0a0a2a; 
            --bg-light: #2a0a4a;
            --neon-pink: #ff00ff; 
            --neon-cyan: #00ffff; 
            --text: #ffffff;
        }
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; 
            background-color: var(--bg-dark); 
            color: var(--text); 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh;
            position: relative; /* Necessário para as camadas funcionarem */
        }

        /* --- FUNDO ANIMADO (CAMADA DE TRÁS) --- */
        .background-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, var(--bg-dark), var(--bg-light));
            z-index: -2; /* Joga bem para trás */
        }
        
        .grid-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 200%;
            background-image: linear-gradient(rgba(255, 0, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 10s linear infinite;
            z-index: -1; /* Fica na frente do fundo roxo, mas atrás do texto */
            pointer-events: none;
        }
        @keyframes moveGrid { from { transform: translateY(0); } to { transform: translateY(-50%); } }

        /* --- CONTEÚDO (CAMADA DA FRENTE) --- */
        .content-layer {
            position: relative; 
            z-index: 10; /* Garante que fique NA FRENTE de tudo */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1; /* Ocupa o espaço todo */
        }

        /* --- CABEÇALHO --- */
        header { 
            width: 100%; 
            padding: 50px 20px 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center;
        }
        
        .logo-img { 
            width: 150px; height: auto; margin-bottom: 20px; border-radius: 50%; 
            box-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-cyan); 
            background: #000; /* Fundo preto pra garantir que a logo apareça */
        }
        
        h1 { 
            font-family: 'Orbitron', sans-serif; 
            font-size: clamp(2rem, 6vw, 3.5rem); 
            font-weight: 900; margin: 0; line-height: 1; 
            text-transform: uppercase; 
            color: var(--neon-cyan); 
            text-shadow: 3px 3px 0px var(--neon-pink); 
        }
        
        h2 { 
            font-size: clamp(0.9rem, 3vw, 1.1rem); 
            font-weight: 700; letter-spacing: 3px; 
            margin-top: 15px; color: var(--neon-pink); 
            text-transform: uppercase; 
            background: rgba(0,0,0,0.3); /* Fundo leve para leitura */
            padding: 5px 10px;
            border-radius: 5px;
        }

        /* --- ÁREA DO VÍDEO --- */
        .video-box {
            width: 100%; 
            max-width: 340px; /* Largura Celular */
            margin: 20px 0 40px;
            border-radius: 15px; 
            overflow: hidden; 
            background: #000;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            position: relative;
        }
        
        /* Proporção Vertical 9:16 */
        .video-ratio {
            width: 100%;
            padding-bottom: 177.77%;
            position: relative;
        }
        
        .video-ratio iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        /* --- RODAPÉ --- */
        footer { 
            padding: 40px; text-align: center; 
            font-size: 0.9rem; margin-top: auto;
            border-top: 1px solid rgba(255,0,255,0.3); 
            width: 100%; background: rgba(0,0,0,0.5); 
        }
        footer a { color: var(--neon-cyan); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>

    <div class="background-layer"></div>
    <div class="grid-layer"></div>

    <div class="content-layer">
        
        <header>
            <img src="vapor.png" alt="Logo Arcos Lab" class="logo-img">
            <h1>ARCOS LAB</h1>
            <h2>Editor de Vídeo | @victorarcoslab</h2>
        </header>

        <div class="video-box">
            <div class="video-ratio">
                <iframe 
                    src="https://www.youtube.com/embed/eYI5FP4VTAs?autoplay=1&mute=1&controls=1&rel=0" 
                    title="Portfolio Arcos Lab" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <footer>
            <p><a href="mailto:victor@arcoslab.com">victor@arcoslab.com</a></p>
        </footer>

    </div>

</body>
</html>
