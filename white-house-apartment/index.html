<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White House Apartment | ARCOS LAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            background: #ffffff; 
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
            /* Animação suave ao abrir a página */
            animation: pageFadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes pageFadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header { padding: 60px 20px 40px; text-align: center; }
        
        .back-button { 
            text-decoration: none; 
            color: #666666; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            transition: color 0.3s ease; 
            display: inline-block;
        }
        .back-button:hover { color: #000000; }
        
        h1 { 
            margin-top: 30px; 
            font-weight: 600; 
            font-size: clamp(1.5rem, 4vw, 2.5rem); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }
        
        .project-gallery { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px 80px; 
            display: flex; 
            flex-direction: column; 
            gap: 30px; 
        }
        
        .project-gallery img { 
            width: 100%; 
            height: auto; 
            display: block; 
            background: #f4f4f4; 
            transition: transform 0.4s ease;
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="back-button">← Back to Portfolio</a>
        <h1>White House Apartment</h1>
    </header>

    <div class="project-gallery">
        <img src="capa.jpg" alt="White House Apartment - Main View">
        <img src="02.jpg" alt="White House Apartment - View 2">
        <img src="03.jpg" alt="White House Apartment - View 3">
        <img src="04.jpg" alt="White House Apartment - View 4">
        <img src="05.jpg" alt="White House Apartment - View 5">
        <img src="06.jpg" alt="White House Apartment - View 6">
        <img src="07.jpg" alt="White House Apartment - View 7">
        <img src="08.jpg" alt="White House Apartment - View 8">
        <img src="09.jpg" alt="White House Apartment - View 9">
        <img src="10.jpg" alt="White House Apartment - View 10">
    </div>

</body>
</html>
